<!doctype html>
<html lang="es" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marcapáginas</title>
  <meta name="description" content="Una lectura al día, de 7 a 15 minutos.">
  <meta name="theme-color" content="#f4ecdc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Marcapáginas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/literata-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
@font-face {
  font-family: 'Literata';
  src: url('fonts/literata-latin-ext-wght-normal.woff2') format('woff2');
  font-weight: 200 900;
  font-style: normal;
  font-display: swap;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Literata';
  src: url('fonts/literata-latin-ext-wght-italic.woff2') format('woff2');
  font-weight: 200 900;
  font-style: italic;
  font-display: swap;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Literata';
  src: url('fonts/literata-latin-wght-normal.woff2') format('woff2');
  font-weight: 200 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Literata';
  src: url('fonts/literata-latin-wght-italic.woff2') format('woff2');
  font-weight: 200 900;
  font-style: italic;
  font-display: swap;
}

:root {
  --paper: #f4ecdc;
  --card: #ede3cd;
  --ink: #2a2018;
  --muted: #7a6a58;
  --rule: #d8cbb0;
  --accent: #8a2e1c;
  --accent-ink: #f8f0e0;
  --hl: rgba(138, 46, 28, .35);
  --fs: 20px;
  --mx: 28px;
  --lh: 1.65;
  color-scheme: light;
}
:root[data-theme='night'] {
  --paper: #1c1713;
  --card: #261f19;
  --ink: #e8dcc8;
  --muted: #a09079;
  --rule: #3a3027;
  --accent: #d58b5a;
  --accent-ink: #1c1713;
  --hl: rgba(213, 139, 90, .45);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme='auto'] {
    --paper: #1c1713;
    --card: #261f19;
    --ink: #e8dcc8;
    --muted: #a09079;
    --rule: #3a3027;
    --accent: #d58b5a;
    --accent-ink: #1c1713;
    --hl: rgba(213, 139, 90, .45);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Literata', Georgia, 'Times New Roman', serif;
  font-size: 17px;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
}
body.reading { padding-bottom: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

/* ---------- Cabecera ---------- */
.top {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: calc(18px + env(safe-area-inset-top)) 0 14px;
  border-bottom: 1px solid var(--rule);
}
.wordmark { font-weight: 600; letter-spacing: .01em; font-size: 18px; }
.date { color: var(--muted); font-size: 13px; font-style: italic; }
.page-title { font-size: 26px; font-weight: 600; padding: 22px 0 6px; }

/* ---------- Lectura del día ---------- */
.today {
  position: relative;
  margin: 26px 0 18px;
  padding: 24px 22px 22px;
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 3px;
}
.ribbon {
  position: absolute; top: -1px; right: 22px;
  width: 22px; height: 46px;
  background: var(--accent);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
}
.label {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
}
.today h1 { font-size: 30px; line-height: 1.15; font-weight: 600; margin: 10px 0 6px; padding-right: 30px; }
.author { font-style: italic; color: var(--muted); }
.meta { margin-top: 14px; font-size: 14px; color: var(--muted); }
.why { margin-top: 4px; font-size: 14px; color: var(--muted); }
.actions { margin-top: 22px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.primary {
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 2px;
  padding: 12px 28px; font-weight: 600; font-size: 16px; letter-spacing: .02em;
}
.primary:active { opacity: .85; }
.link {
  background: none; border: 0; padding: 4px 0;
  color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule);
  text-underline-offset: 4px; font-size: 15px;
}
.link.danger { color: var(--accent); }
.done-mark { color: var(--accent); font-size: 14px; margin-top: 12px; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--rule); }
.row:first-of-type { border-top: 0; }
.row .k { color: var(--muted); font-size: 14px; }

.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 14px; font-size: 14px; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }

.week { display: flex; gap: 8px; align-items: center; }
.week span {
  width: 30px; text-align: center; font-size: 12px; color: var(--muted);
  padding-bottom: 6px; border-bottom: 2px solid var(--rule);
}
.week span.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.week span.now { color: var(--ink); }
.soft { color: var(--muted); font-size: 14px; padding: 4px 0 14px; }

.note-box {
  margin-top: 22px; padding: 14px 16px; border: 1px dashed var(--rule);
  font-size: 14px; color: var(--muted); border-radius: 3px;
}
.note-box p + p { margin-top: 6px; }
.note-box .link { margin-top: 8px; font-size: 14px; }

/* ---------- Listas ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; background: none; border: 1px solid var(--rule); border-radius: 2px;
  padding: 6px 12px; font-size: 14px; color: var(--muted);
}
.chip[aria-pressed='true'] { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--rule); }
.list li:last-child { border-bottom: 1px solid var(--rule); }
.item {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 14px 2px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
}
.item .t { font-weight: 600; font-size: 17px; }
.item .a { color: var(--muted); font-size: 14px; font-style: italic; }
.item .m { color: var(--muted); font-size: 13px; white-space: nowrap; text-align: right; }
.item .m .ok { color: var(--accent); }
.add { margin: 4px 0 16px; width: 100%; }
.secondary {
  background: none; border: 1px solid var(--ink); border-radius: 2px;
  padding: 11px 18px; font-weight: 500; font-size: 15px;
}
.empty { color: var(--muted); padding: 30px 0; text-align: center; font-style: italic; }

/* ---------- Cuaderno ---------- */
.search {
  width: 100%; margin: 12px 0 6px; padding: 10px 12px;
  background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px;
  font: inherit; font-size: 16px;
}
.word { padding: 16px 2px; border-top: 1px solid var(--rule); }
.word h3 { font-size: 20px; font-weight: 600; }
.word .def { margin-top: 4px; }
.word .ln { margin-top: 4px; font-size: 15px; }
.word .ln b { font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-right: 8px; }
.word .src { margin-top: 8px; font-size: 13px; color: var(--muted); font-style: italic; display: flex; justify-content: space-between; align-items: center; }
.pend { color: var(--muted); font-style: italic; font-size: 14px; }

/* ---------- Barra inferior ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center;
  background: var(--paper); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs nav { display: flex; width: 100%; max-width: 640px; }
.tabs a {
  flex: 1; text-align: center; padding: 16px 0 14px; text-decoration: none;
  color: var(--muted); font-size: 15px; border-top: 2px solid transparent; margin-top: -1px;
}
.tabs a[aria-current='page'] { color: var(--ink); border-top-color: var(--accent); font-weight: 600; }

/* ---------- Lector ---------- */
.rbar {
  position: sticky; top: 0; z-index: 15;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.rbar .title { font-size: 13px; color: var(--muted); font-style: italic; flex: 1; text-align: center; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rbar button { background: none; border: 0; padding: 8px 10px; font-size: 17px; min-width: 44px; }
.rbar .aa { font-weight: 600; }
.rbar .aa small { font-size: 12px; }
.progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 30; }

.reader {
  max-width: 40rem; margin: 0 auto;
  padding: 26px var(--mx) 40px;
  font-size: var(--fs); line-height: var(--lh);
  touch-action: pan-y;
  hyphens: auto; -webkit-hyphens: auto;
  overflow-wrap: break-word;
}
.reader .rtitle { font-size: 1.5em; line-height: 1.15; font-weight: 600; margin-bottom: 4px; }
.reader .rauthor { font-style: italic; color: var(--muted); font-size: .85em; margin-bottom: 1.6em; }
.reader p { margin: 0 0 .85em; }
.reader h2.ch {
  font-size: .8em; letter-spacing: .16em; text-transform: uppercase; text-align: center;
  color: var(--muted); font-weight: 500; margin: 2em 0 1.1em;
}
.reader .stanza { margin: 0 0 1.3em; hyphens: none; }
.reader .poem-wrap { padding-left: .6em; }
.w { border-radius: 2px; }
.w.saved { text-decoration: underline; text-decoration-color: var(--hl); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.w.sel { background: var(--hl); }

.end { max-width: 40rem; margin: 0 auto; padding: 8px var(--mx) calc(60px + env(safe-area-inset-bottom)); }
.end hr { border: 0; border-top: 1px solid var(--rule); margin: 0 0 22px; }
.end .q { font-style: italic; font-size: 1.05em; line-height: 1.5; margin: 8px 0 14px; }
.end textarea {
  width: 100%; min-height: 84px; padding: 10px 12px; resize: vertical;
  background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px;
  font: inherit; font-size: 16px; line-height: 1.5;
}
.end .actions { margin-top: 18px; }

/* ---------- Hojas inferiores ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20, 12, 6, .35); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  background: var(--paper); border-top: 1px solid var(--rule);
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .18);
  padding: 10px 22px calc(22px + env(safe-area-inset-bottom));
  max-height: 72vh; overflow-y: auto;
}
.sheet .inner { max-width: 640px; margin: 0 auto; }
.grip { width: 38px; height: 3px; background: var(--rule); border-radius: 2px; margin: 0 auto 14px; }
.sheet h3 { font-size: 24px; font-weight: 600; }
.sheet .st { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 12px; font-size: 13px; color: var(--muted); }
.sheet dl { margin: 0; }
.sheet dt { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
.sheet dd { margin: 2px 0 0; font-size: 17px; }
.sheet dd.na { color: var(--muted); font-style: italic; font-size: 15px; }

.ctrl { padding: 12px 0; border-top: 1px solid var(--rule); }
.ctrl:first-of-type { border-top: 0; }
.ctrl .lbl { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper button { width: 46px; height: 42px; border: 1px solid var(--rule); background: var(--card); border-radius: 2px; }
.stepper input[type=range] { flex: 1; accent-color: var(--accent); }
.ctrl .seg { width: 100%; }
.ctrl .seg button { flex: 1; padding: 9px 4px; font-size: 13px; }

.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--paper); overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
}
.overlay .inner { max-width: 560px; margin: 0 auto; }
.overlay h2 { font-size: 24px; margin-bottom: 6px; }
.overlay p.hint { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.field { display: block; margin: 14px 0; }
.field span { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px; background: var(--card); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 2px; font: inherit; font-size: 16px;
}
.field textarea { min-height: 110px; }
.filebtn { display: block; text-align: center; padding: 22px 10px; border: 1px dashed var(--muted); border-radius: 3px; color: var(--muted); }
.filebtn input { display: none; }
.err { color: var(--accent); margin: 12px 0; font-size: 15px; }
.busy { color: var(--muted); font-style: italic; margin: 14px 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 2px;
  font-size: 14px; z-index: 60; max-width: 86vw; text-align: center;
  animation: fade 2.6s forwards;
}
@keyframes fade { 0% { opacity: 0 } 10% { opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }

@media (min-width: 720px) {
  body { font-size: 18px; }
  .today h1 { font-size: 34px; }
}

.sep { border: 0; border-top: 1px solid var(--rule); margin: 24px 0 16px; }
.searchrow { display: flex; gap: 8px; margin-bottom: 12px; }
.searchrow input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px; background: transparent; color: var(--ink); border: 1px solid var(--muted); border-radius: 3px; }

/* Añadir libro: tres opciones numeradas */
.opt { display: flex; gap: 14px; padding: 18px 0; border-top: 1px solid var(--rule); }
.opt:first-of-type { border-top: 0; padding-top: 6px; }
.opt-n { flex: none; width: 26px; height: 26px; border: 1px solid var(--accent); color: var(--accent); border-radius: 50%; display: grid; place-items: center; font-size: 14px; margin-top: 2px; }
.opt-b { flex: 1; min-width: 0; }
.opt h3 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
.overlay .opt p.hint { margin-bottom: 12px; }
.opt .filebtn { padding: 16px 10px; }
.paste { display: block; width: 100%; min-height: 90px; font: inherit; font-size: 16px; padding: 10px 12px; margin-bottom: 10px; background: transparent; color: var(--ink); border: 1px solid var(--muted); border-radius: 3px; box-sizing: border-box; }
.opt .secondary { width: 100%; }
.sum { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 4px 0 18px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.sum dt { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.sum dd { margin: 0; }

</style>
</head>
<body>
  <div id="app"><p id="boot" style="padding:40px 24px;font-family:Georgia,serif;color:#7a6a58">Cargando…</p></div>
  <noscript>Marcapáginas necesita JavaScript para funcionar.</noscript>
  <script>
    // Si algo falla al arrancar, mostrarlo en pantalla en vez de dejarla en blanco.
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return;
        var app = document.getElementById('app');
        if (!app || (!document.getElementById('boot') && app.children.length)) return;
        shown = true;
        app.innerHTML = '<div style="padding:32px 22px;font-family:Georgia,serif;color:#2a2018;line-height:1.5">' +
          '<p style="font-size:20px;margin:0 0 10px">No se ha podido abrir Marcapáginas.</p>' +
          '<p style="color:#7a6a58;margin:0 0 14px">Haz una captura de esta pantalla y envíala para revisarlo.</p>' +
          '<pre style="white-space:pre-wrap;font-size:13px;background:#ede3cd;padding:12px;border-radius:3px"></pre>' +
          '<button id="reset" style="margin-top:14px;font:inherit;padding:10px 16px;background:#8a2e1c;color:#f8f0e0;border:0;border-radius:3px">Reiniciar la app</button></div>';
        var pre = app.querySelector('pre');
        pre.textContent = msg + '\n\n' + navigator.userAgent;
        var files = ['sw.js', 'manifest.webmanifest', 'fonts/literata-latin-wght-normal.woff2', 'icons/icon-192.png', 'vendor/jszip.min.js'];
        Promise.all(files.map(function (f) {
          return fetch(f, { cache: 'no-store' }).then(function (r) { return f + ': ' + (r.ok ? 'ok' : r.status); }, function () { return f + ': sin respuesta'; });
        })).then(function (rs) { pre.textContent += '\n\nArchivos:\n' + rs.join('\n'); });
        document.getElementById('reset').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
        };
      }
      window.addEventListener('error', function (e) {
        var where = e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '';
        var t = e.target;
        if (t && t !== window && t.tagName) {
          if (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet')) show('No se pudo cargar: ' + (t.src || t.href));
          return;
        }
        show((e.message || 'Error') + where);
      }, true);
      window.addEventListener('unhandledrejection', function (e) { show('Error: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      setTimeout(function () { if (document.getElementById('boot')) show('La app no ha terminado de arrancar en 8 segundos.'); }, 8000);
    })();
